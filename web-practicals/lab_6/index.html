<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Markdown-редактор</title>

  <!-- підключаємо бібліотеку marked через CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: sans-serif; background: #f0f0f0; }

    /* заголовок сторінки */
    h1 {
    background: #333;
    color: white;
    padding: 12px 20px;
    font-size: 18px;
    }

    /* два блоки поруч */
    .wrapper {
    display: flex;
    height: calc(100vh - 80px); /* висота на весь екран мінус шапка й лічильник */
    gap: 10px;
    padding: 10px; 
    }
    
    textarea, #preview { /* стилі для поля вводу та зони перегляду */
    flex: 1; /* ділять 50 на 50 */
    padding: 16px;
    font-size: 14px;
    border: 1px solid #ccc;
    background: white;
    overflow-y: auto; /* вертикальна прокрутка якщо текст не влазить */  
    }

    textarea {
    font-family: monospace;
    resize: none; /* забороняємо розтягувати мишкою */
    outline: none; /* прибираємо контур при фокусі */
    }

    /* оформлення цитати */
    #preview blockquote {
    border-left: 4px solid #333;
    padding: 8px 16px;
    margin: 12px 0;
    background: #f5f5f5;
    color: #555;
    }

    /* лічильник внизу */
    #counter {
    padding: 8px 20px;
    font-size: 13px;
    color: #666;
    }
  </style>
</head>
<body>

  <h1>Markdown-редактор</h1>

  <div class="wrapper">
    <!-- ліворуч вводимо markdown -->
    <textarea id="editor" spellcheck="false"></textarea>

    <!-- праворуч бачимо результат -->
    <div id="preview"></div>
  </div>

  <!-- лічильник символів і слів -->
  <div id="counter">0 символів · 0 слів</div>

  <script>
    const editor  = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const counter = document.getElementById('counter');

    // початковий текст 5+ обов'язкових елементів
    editor.value = `# Заголовок

## Основні елементи

- **Жирний** текст
- *Курсив*
- [Посилання](https://ukma.edu.ua)

## Список

1. Перший пункт
2. Другий пункт
3. Третій пункт

## Цитата

> 67

## Код

\`console.log('hello')\`
`;

    // функція оновлює праву панель і лічильник
    function update() {
    // marked.parse() конвертує markdown рядок в html рядок
    preview.innerHTML = marked.parse(editor.value);

    // лічильник символів і слів
    const text  = editor.value;
    const chars = text.length;
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    counter.textContent = `${chars} символів · ${words} слів`;
    }

    // input подія спрацьовує при кожному натисканні клавіші
    editor.addEventListener('input', update);

    // одразу рендеримо початковий текст
    update();
  </script>

</body>
</html>
